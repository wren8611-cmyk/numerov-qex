[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "pybind11>=2.13"
]
build-backend = "setuptools.build_meta"

[project]
name = "numerov-qex"
version = "0.1.0"
description = "Coupled-channel radial Schrödinger equation solver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy"
]